  <path class="lo-line" pathLength="100" d="M18,45 C16,49 18,53 22,54 C25,55 27,52 25,50 C24,49 22,50 22,52"/>
  <path class="lo-line" pathLength="100" d="M3,52 C0,55 -1,59 1,63 C2,65 5,65 5,62"/>

