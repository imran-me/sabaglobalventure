<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <title>Bengal ivory ground — lotus, paisley, river waves</title>
  <g fill="none" stroke="#A8791F" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.34" stroke-width="1.2">
    <!-- river waves running across -->
    <path d="M0 40 C35 26 70 54 105 40 C140 26 175 54 210 40 C245 26 280 54 315 40"/>
    <path d="M-35 240 C0 226 35 254 70 240 C105 226 140 254 175 240 C210 226 245 254 280 240"/>
    <path d="M0 46 C35 32 70 60 105 46 C140 32 175 60 210 46 C245 32 280 60 315 46" stroke-opacity="0.18"/>

    <!-- central lotus flower -->
    <g transform="translate(140 128)">
      <path d="M0 22 C-4 4 -4 -22 0 -40 C4 -22 4 4 0 22Z"/>
      <path d="M0 22 C-16 10 -28 -8 -32 -30 C-14 -22 -2 -6 0 22Z"/>
      <path d="M0 22 C16 10 28 -8 32 -30 C14 -22 2 -6 0 22Z"/>
      <path d="M0 22 C-28 14 -46 2 -54 -18 C-28 -14 -8 4 0 22Z" stroke-opacity="0.22"/>
      <path d="M0 22 C28 14 46 2 54 -18 C28 -14 8 4 0 22Z" stroke-opacity="0.22"/>
      <path d="M-30 28 C-12 20 12 20 30 28" stroke-opacity="0.2"/>
    </g>

    <!-- paisley buta, top-left and bottom-right -->
    <g transform="translate(48 96)">
      <path d="M0 0 C-14 -6 -18 -22 -8 -32 C4 -42 22 -34 22 -18 C22 -6 12 2 2 0"/>
      <path d="M-2 -8 C-8 -12 -8 -20 -2 -24 C6 -28 12 -22 10 -14"/>
    </g>
    <g transform="translate(232 184) rotate(180)">
      <path d="M0 0 C-14 -6 -18 -22 -8 -32 C4 -42 22 -34 22 -18 C22 -6 12 2 2 0"/>
      <path d="M-2 -8 C-8 -12 -8 -20 -2 -24 C6 -28 12 -22 10 -14"/>
    </g>

    <!-- small five-petal flowers scattered -->
    <g transform="translate(230 60)" stroke-opacity="0.28">
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(72)"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(144)"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(216)"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(288)"/>
    </g>
    <g transform="translate(52 210)" stroke-opacity="0.28">
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(72)"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(144)"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(216)"/>
      <path d="M0 0 C-3 -2 -3 -7 0 -9 C3 -7 3 -2 0 0Z" transform="rotate(288)"/>
    </g>
  </g>
</svg>
