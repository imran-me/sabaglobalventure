<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132" shape-rendering="geometricPrecision">
  <title>Saba Global Venture - nakshi kantha seamless gold damask</title>
  <defs>
    <!-- single lotus/paisley petal, tip up, base at origin -->
    <path id="kPetal" d="M0,0 C-4.2,-8.5 -3.4,-18 0,-24.5 C3.4,-18 4.2,-8.5 0,0 Z"/>
    <path id="kPaisley" d="M0,-10 C7,-14 12,-8 9,-2 C7,2.5 1.5,3.5 -1,0.5 C-2.8,-1.6 -1.8,-4.8 0.8,-5 C2.6,-5.1 3.6,-3.6 3.3,-2.2"/>

    <!-- central lotus flower rosette -->
    <g id="kFlower">
      <circle r="33" fill="none" stroke="#C9A24B" stroke-width="0.9" stroke-dasharray="1.6 4.2" stroke-linecap="round" opacity="0.9"/>
      <circle r="27.5" fill="none" stroke="#C9A24B" stroke-width="0.7" opacity="0.75"/>
      <g fill="none" stroke="#C9A24B" stroke-width="1" stroke-linejoin="round">
        <use href="#kPetal" transform="rotate(0)"/>
        <use href="#kPetal" transform="rotate(45)"/>
        <use href="#kPetal" transform="rotate(90)"/>
        <use href="#kPetal" transform="rotate(135)"/>
        <use href="#kPetal" transform="rotate(180)"/>
        <use href="#kPetal" transform="rotate(225)"/>
        <use href="#kPetal" transform="rotate(270)"/>
        <use href="#kPetal" transform="rotate(315)"/>
      </g>
      <g fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-linecap="round" opacity="0.85">
        <use href="#kPaisley" transform="rotate(22.5) translate(0,-16)"/>
        <use href="#kPaisley" transform="rotate(112.5) translate(0,-16)"/>
        <use href="#kPaisley" transform="rotate(202.5) translate(0,-16)"/>
        <use href="#kPaisley" transform="rotate(292.5) translate(0,-16)"/>
      </g>
      <circle r="7.5" fill="none" stroke="#C9A24B" stroke-width="0.8"/>
      <circle r="3.4" fill="none" stroke="#C9A24B" stroke-width="0.7" stroke-dasharray="1.2 2.2"/>
      <circle r="1.3" fill="#C9A24B"/>
    </g>

    <!-- corner rosette: full flower, clipped by the tile viewport so quarters meet across tiles -->
    <g id="kCorner">
      <g fill="none" stroke="#C9A24B" stroke-width="0.95" stroke-linejoin="round">
        <use href="#kPetal" transform="rotate(0) scale(0.62)"/>
        <use href="#kPetal" transform="rotate(45) scale(0.62)"/>
        <use href="#kPetal" transform="rotate(90) scale(0.62)"/>
        <use href="#kPetal" transform="rotate(135) scale(0.62)"/>
        <use href="#kPetal" transform="rotate(180) scale(0.62)"/>
        <use href="#kPetal" transform="rotate(225) scale(0.62)"/>
        <use href="#kPetal" transform="rotate(270) scale(0.62)"/>
        <use href="#kPetal" transform="rotate(315) scale(0.62)"/>
      </g>
      <circle r="19.5" fill="none" stroke="#C9A24B" stroke-width="0.85" stroke-dasharray="1.5 3.8" stroke-linecap="round" opacity="0.9"/>
      <circle r="5" fill="none" stroke="#C9A24B" stroke-width="0.75"/>
      <circle r="1.2" fill="#C9A24B"/>
    </g>

    <!-- lozenge that straddles an edge midpoint -->
    <g id="kEdgeGem">
      <path d="M0,-8.5 L8.5,0 L0,8.5 L-8.5,0 Z" fill="none" stroke="#C9A24B" stroke-width="0.9"/>
      <path d="M0,-4 L4,0 L0,4 L-4,0 Z" fill="none" stroke="#C9A24B" stroke-width="0.7" opacity="0.8"/>
    </g>
  </defs>

  <!-- running-stitch spokes to the four edge midpoints (they meet their twin in the next tile) -->
  <g fill="none" stroke="#C9A24B" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="2 3.6" opacity="0.9">
    <path d="M66,38 L66,0"/>
    <path d="M66,94 L66,132"/>
    <path d="M38,66 L0,66"/>
    <path d="M94,66 L132,66"/>
  </g>

  <!-- running-stitch spokes toward the four corner rosettes -->
  <g fill="none" stroke="#C9A24B" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="1.8 3.4" opacity="0.75">
    <path d="M39.5,39.5 L14.5,14.5"/>
    <path d="M92.5,39.5 L117.5,14.5"/>
    <path d="M39.5,92.5 L14.5,117.5"/>
    <path d="M92.5,92.5 L117.5,117.5"/>
  </g>

  <use href="#kFlower" x="66" y="66"/>

  <use href="#kEdgeGem" x="66" y="0"/>
  <use href="#kEdgeGem" x="66" y="132"/>
  <use href="#kEdgeGem" x="0" y="66"/>
  <use href="#kEdgeGem" x="132" y="66"/>

  <use href="#kCorner" x="0" y="0"/>
  <use href="#kCorner" x="132" y="0"/>
  <use href="#kCorner" x="0" y="132"/>
  <use href="#kCorner" x="132" y="132"/>
</svg>
