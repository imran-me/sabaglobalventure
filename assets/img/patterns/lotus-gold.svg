<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132" shape-rendering="geometricPrecision">
  <title>Saba Global Venture - seamless lotus star lattice</title>
  <defs>
    <path id="lPetal" d="M0,-34 C3.6,-25 4.6,-16 0,-9 C-4.6,-16 -3.6,-25 0,-34 Z"/>

    <g id="lLotus">
      <!-- 8-point star: two squares on the same centre -->
      <g fill="none" stroke="#C9A24B" stroke-width="0.9">
        <rect x="-17" y="-17" width="34" height="34"/>
        <rect x="-17" y="-17" width="34" height="34" transform="rotate(45)"/>
      </g>
      <!-- eight lotus petals on the star axes -->
      <g fill="none" stroke="#C9A24B" stroke-width="0.9" stroke-linejoin="round">
        <use href="#lPetal" transform="rotate(0)"/>
        <use href="#lPetal" transform="rotate(45)"/>
        <use href="#lPetal" transform="rotate(90)"/>
        <use href="#lPetal" transform="rotate(135)"/>
        <use href="#lPetal" transform="rotate(180)"/>
        <use href="#lPetal" transform="rotate(225)"/>
        <use href="#lPetal" transform="rotate(270)"/>
        <use href="#lPetal" transform="rotate(315)"/>
      </g>
      <circle r="44" fill="none" stroke="#C9A24B" stroke-width="0.7" opacity="0.65"/>
      <circle r="8" fill="none" stroke="#C9A24B" stroke-width="0.8"/>
      <circle r="1.6" fill="#C9A24B"/>
    </g>

    <g id="lCornerGem">
      <path d="M0,-13 L13,0 L0,13 L-13,0 Z" fill="none" stroke="#C9A24B" stroke-width="0.9"/>
      <path d="M0,-6.5 L6.5,0 L0,6.5 L-6.5,0 Z" fill="none" stroke="#C9A24B" stroke-width="0.75" opacity="0.8"/>
      <circle r="1.4" fill="#C9A24B"/>
    </g>

    <g id="lEdgeGem">
      <path d="M0,-9.5 L9.5,0 L0,9.5 L-9.5,0 Z" fill="none" stroke="#C9A24B" stroke-width="0.9"/>
      <circle r="1.3" fill="#C9A24B"/>
    </g>
  </defs>

  <!-- inscribed diamond: its vertices land exactly on the four edge midpoints, so
       adjacent tiles continue the line at 90 deg into an unbroken diagonal lattice -->
  <path d="M66,0 L132,66 L66,132 L0,66 Z" fill="none" stroke="#C9A24B" stroke-width="1"/>

  <!-- half-scale lattice: chords cutting each corner, meeting their twins across the seam -->
  <g fill="none" stroke="#C9A24B" stroke-width="0.8" opacity="0.8">
    <path d="M33,0 L0,33"/>
    <path d="M99,0 L132,33"/>
    <path d="M0,99 L33,132"/>
    <path d="M132,99 L99,132"/>
  </g>

  <!-- corner diagonals, broken clear of the central lotus -->
  <g fill="none" stroke="#C9A24B" stroke-width="0.8" opacity="0.75">
    <path d="M0,0 L34.9,34.9"/>
    <path d="M132,0 L97.1,34.9"/>
    <path d="M0,132 L34.9,97.1"/>
    <path d="M132,132 L97.1,97.1"/>
  </g>

  <use href="#lLotus" x="66" y="66"/>

  <use href="#lEdgeGem" x="66" y="0"/>
  <use href="#lEdgeGem" x="66" y="132"/>
  <use href="#lEdgeGem" x="0" y="66"/>
  <use href="#lEdgeGem" x="132" y="66"/>

  <use href="#lCornerGem" x="0" y="0"/>
  <use href="#lCornerGem" x="132" y="0"/>
  <use href="#lCornerGem" x="0" y="132"/>
  <use href="#lCornerGem" x="132" y="132"/>
</svg>
