<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130">
  <!-- hull: flared bow, bulbous bow at waterline, flat keel, curved stern counter, deck line on top -->
  <path fill="#000" d="M24 74
    C16 74 10 76 8 82
    C7 86 8 90 11 92
    C13 94 15 95 18 96
    L224 96
    C231 96 236 92 236.5 84
    L235 74
    Z"/>

  <!-- tiny bow mast -->
  <polygon points="20.5,74 22.5,74 21.8,56 21.2,56" fill="#000"/>

  <!-- container bays: varying heights, wide/flat landscape blocks, gaps at hatch lines -->
  <rect x="30" y="60" width="26" height="14" fill="#000"/>
  <path fill="#000" d="M59 74 L59 62 L67 62 L67 54 L81 54 L81 62 L89 62 L89 74 Z"/>
  <rect x="92" y="62" width="22" height="12" fill="#000"/>
  <rect x="117" y="56" width="32" height="18" fill="#000"/>
  <rect x="152" y="64" width="24" height="10" fill="#000"/>

  <!-- aft superstructure: single flared bridge block with wing overhang and window slit -->
  <path fill="#000" fill-rule="evenodd" d="M193 74 L193 34 L188 34 L188 28 L221 28 L221 34 L217 34 L217 74 Z
    M191 30.2 H218 V31.8 H191 Z"/>

  <!-- radar mast atop bridge roof -->
  <rect x="204" y="18" width="2" height="10" fill="#000"/>
  <ellipse cx="205" cy="16.5" rx="2.6" ry="1.4" fill="#000"/>

  <!-- funnel: separate tapered shape behind/above the bridge, near stern, clear of the wing -->
  <polygon points="227,74 236,74 234.5,30 228.5,30" fill="#000"/>

  <!-- two wake slits -->
  <rect x="20" y="104" width="95" height="3" rx="1.5" fill="#000"/>
  <rect x="125" y="104" width="95" height="3" rx="1.5" fill="#000"/>
</svg>
