<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170">
  <!-- ===== crane 2 (background, partially behind) ===== -->
  <polygon points="118,148 134,148 131,110 125,110" fill="#000"/>
  <polygon points="158,148 174,148 162,110 155,110" fill="#000"/>
  <rect x="125" y="107" width="37" height="4" fill="#000"/>
  <rect x="132" y="96" width="22" height="11" fill="#000"/>
  <polygon points="144,96 154,96 149,80" fill="#000"/>
  <polygon points="154,102 154,97 122,93 108,90 100,86 100,90 108,94 122,98" fill="#000"/>
  <polygon points="154,98 154,102 172,100 172,97" fill="#000"/>
  <rect x="170" y="95" width="10" height="9" fill="#000"/>

  <!-- ===== crane 1 (main, foreground) ===== -->
  <!-- sill beam and bogies -->
  <rect x="40" y="148" width="90" height="6" fill="#000"/>
  <rect x="44" y="154" width="18" height="8" fill="#000"/>
  <rect x="108" y="154" width="18" height="8" fill="#000"/>
  <!-- A-frame portal legs (taper inward toward top) -->
  <polygon points="46,148 70,148 66,94 58,94" fill="#000"/>
  <polygon points="100,148 124,148 104,94 96,94" fill="#000"/>
  <!-- portal cap beam -->
  <rect x="58" y="90" width="46" height="6" fill="#000"/>
  <!-- machine house -->
  <rect x="68" y="74" width="34" height="17" fill="#000"/>
  <!-- A-frame mast to apex -->
  <polygon points="88,74 104,74 96,46" fill="#000"/>
  <!-- backstay tie bars (apex to boom pivot, apex to counterweight tip) -->
  <polygon points="94,47 98,47 108,81 104,81" fill="#000"/>
  <polygon points="94,48 98,48 142,87 138,89" fill="#000"/>
  <!-- boom, reaching seaward with slight upward hitch at tip -->
  <polygon points="104,86 104,78 55,74 24,70 10,62 10,69 24,77 55,81" fill="#000"/>
  <!-- backreach with counterweight -->
  <polygon points="104,80 104,86 140,90 140,84" fill="#000"/>
  <rect x="136" y="80" width="16" height="16" fill="#000"/>
  <!-- trolley -->
  <rect x="29" y="75" width="13" height="7" fill="#000"/>
  <!-- hoist falls -->
  <rect x="32" y="81" width="2" height="23" fill="#000"/>
  <rect x="39" y="81" width="2" height="23" fill="#000"/>
  <!-- spreader and hanging container -->
  <rect x="27" y="103" width="18" height="3" fill="#000"/>
  <rect x="27" y="106" width="18" height="14" fill="#000"/>

  <!-- ===== quay line with two stacked containers ===== -->
  <rect x="0" y="150" width="200" height="3" fill="#000"/>
  <rect x="4" y="126" width="30" height="12" fill="#000"/>
  <rect x="4" y="138" width="30" height="12" fill="#000"/>
</svg>
