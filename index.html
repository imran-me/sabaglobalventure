  <!-- =========================================================================
       HOME PAGE — composed from /sections partials via assets/js/include.js.
       NOTE: serve over HTTP (e.g. `python -m http.server`); file:// blocks the
       fetch-based includes and you'll get a blank page.
       ====================================================================== -->

  <!-- Background canvas — INLINED (not fetched) so the glow + scene paint on the
       first frame with no pop-in. background.js adds particles + side accents. -->
  <div class="bg-stage" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="bg-weave"></div>
    <div class="bg-scene"></div>
    <div class="bg-waves"></div>
    <div class="bg-veil"></div>
  </div>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- The shared লতা পাতা arch ornament, defined once and <use>d by every arch
       (hero portal, story portrait, every product niche). Renders nothing itself. -->
  <div data-include="sections/defs.html"></div>

  <div data-include="sections/header.html"></div>

  <!-- =========================================================================
       THE NARRATIVE. Deliberately NOT the conventional
       hero → stats → features → grid → map → contact stack.

       Told in numbered chapters, and it ALTERNATES canvas colour — deep indigo,
       warm ivory, indigo again — so the page BREATHES. An unbroken dark canvas
       reads as a template however good the colour is; the ivory interludes are
       what read as editorial.

       The FEATURED deck sits first, right after the hero. Colour moves in long
       MOVEMENTS, never stripes — a thin dark band pinched between two ivory
       sections reads as zebra, and zebra reads as cheap. So the two ivory
       moments are CONTIGUOUS (featured + origin = one bright movement), and the
       numbers band opens the long dark movement that carries the catalogue:
         DARK  hero
         IVORY featured → origin        (one breath, jamdani continuing)
         DARK  numbers → alpona → catalogue → journey…
         IVORY house
         DARK  reach → invite → desk
       ====================================================================== -->
  <main>
    <div data-include="sections/hero.html"></div>

    <!-- The ivory movement, part one: a bright glimpse of the signature lines
         the moment you arrive. -->
    <div data-include="sections/featured.html"></div>

    <!-- The ivory movement, part two: 01, where the goods come from. Same
         paper, same weave — the seam between the two is a single hairline. -->
    <div data-include="sections/about.html"></div>

    <!-- The numbers open the dark movement. -->
    <div data-include="sections/trust.html"></div>

    <div data-include="sections/alpona.html"></div>

    <!-- 02 — the catalogue proper, as arched portraits. -->
    <div data-include="sections/products.html"></div>

    <!-- 03 — how the house works. Ivory again. -->
    <div data-include="sections/capabilities.html"></div>

    <!-- The Journey. Sits here deliberately: it is the bridge from "how we
         work" to "where it goes" — one gold line from the paddy field to the
         ship, drawn as you read it. Then the map shows you the world it sails to. -->
    <div data-include="sections/frieze.html"></div>

    <!-- 04 — where it all goes. -->
    <div data-include="sections/markets.html"></div>

    <div data-include="sections/cta.html"></div>

    <!-- 05 — the trade desk. -->
    <div data-include="sections/contact.html"></div>
  </main>

  <div data-include="sections/furniture.html"></div>
