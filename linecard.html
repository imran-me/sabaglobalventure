<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Card — Saba Global Ventures</title>
  <meta name="description" content="The Saba Global Ventures line card: bulk rice, shrimp, fish, fresh produce, spices and agro foods from Bangladesh. Print or save as PDF.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Print-first: ink on paper, one gold accent. Buyers file this. */
    :root { --gold: #8C6C1E; --ink: #081B45; --line: #d8cfae; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Manrope", system-ui, sans-serif; font-size: 13px; color: #222;
      max-width: 900px; margin: 0 auto; padding: 2.2rem 1.6rem 3rem; background: #fff;
    }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
             border-bottom: 2px solid var(--gold); padding-bottom: 1.1rem; }
    .brand h1 { font-family: "Cormorant Garamond", serif; font-size: 1.9rem; color: var(--ink); }
    .brand p { color: var(--gold); font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; margin-top: .15rem; }
    .contact { text-align: right; font-size: .8rem; line-height: 1.65; color: #444; }
    .contact b { color: var(--ink); }
    .meta { display: flex; justify-content: space-between; gap: 1rem; margin: .8rem 0 1.4rem;
            font-size: .75rem; color: #666; }
    .toolbar { text-align: center; margin: 1rem 0 1.6rem; }
    .toolbar button {
      font: 600 .85rem "Manrope", sans-serif; color: #fff; background: var(--ink);
      border: 0; border-radius: 999px; padding: .65rem 1.6rem; cursor: pointer;
    }
    h2.cat {
      font-family: "Cormorant Garamond", serif; font-size: 1.25rem; color: var(--ink);
      border-bottom: 1px solid var(--line); padding-bottom: .3rem; margin: 1.5rem 0 .6rem;
      break-after: avoid;
    }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
         color: var(--gold); padding: .35rem .5rem .35rem 0; border-bottom: 1px solid var(--line); }
    td { padding: .45rem .5rem .45rem 0; border-bottom: 1px solid #eee7d2; vertical-align: top; }
    td.name { font-weight: 600; color: var(--ink); white-space: nowrap; }
    tr { break-inside: avoid; }
    footer { margin-top: 2rem; padding-top: .9rem; border-top: 2px solid var(--gold);
             font-size: .75rem; color: #666; display: flex; justify-content: space-between; gap: 1rem; }
    @media print {
      .toolbar { display: none; }
      body { padding: 0; font-size: 11.5px; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand" style="display:flex;align-items:center;gap:14px">
      <!-- The house seal — the same shapla that rides the products banner,
           embossed here as the letterhead mark (ART-VISION #22). -->
      <svg width="46" height="30" viewBox="0 0 48 30" fill="none" stroke="#8C6C1E" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 26 C21 18 21 9 24 3 C27 9 27 18 24 26 Z"/>
        <path d="M24 26 C18 21 13 14 13 6 C19 9 23 16 24 26 Z"/>
        <path d="M24 26 C30 21 35 14 35 6 C29 9 25 16 24 26 Z"/>
        <path d="M24 26 C15 24 8 20 4 13 C12 13 20 18 24 26 Z" stroke-opacity=".6"/>
        <path d="M24 26 C33 24 40 20 44 13 C36 13 28 18 24 26 Z" stroke-opacity=".6"/>
      </svg>
      <div>
        <h1>Saba Global Ventures</h1>
        <p>Line Card · From Bangladesh, To The World</p>
      </div>
    </div>
    <div class="contact" id="lc-contact"></div>
  </header>
  <div class="meta">
    <span id="lc-date"></span>
    <span>Inquiry-only — no prices published. MOQ applies · FOB / CIF terms available.</span>
  </div>
  <div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button></div>
  <main id="lc-body"><p style="padding:2rem 0;color:#888">Loading the catalogue…</p></main>
  <footer>
    <span>© <span id="lc-year"></span> Saba Global Ventures — Cumilla, Bangladesh</span>
    <span>www.sabaglobalventures.com</span>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/data/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    (function () {
      if (window.Store) window.Store.ready();
      const c = window.SITE_CONFIG || {};
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

      document.getElementById("lc-contact").innerHTML =
        `<b>${esc(c.director || "")}</b> — ${esc(c.directorTitle || "")}<br>` +
        `WhatsApp +${esc(c.whatsapp || "")}<br>${esc(c.email || "")}<br>${esc(c.address || "")}`;
      document.getElementById("lc-date").textContent =
        "Issued " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
      document.getElementById("lc-year").textContent = new Date().getFullYear();

      const products = (window.Store ? window.Store.getProducts() : (window.PRODUCTS || []))
        .filter((p) => p.status !== "draft");
      const cats = [...new Set(products.map((p) => p.category))];
      const row = (p) => `<tr>
        <td class="name">${esc(p.name)}</td>
        <td>${esc((p.origins || []).join(", "))}</td>
        <td>${esc((p.grades || []).join(", "))}</td>
        <td>${esc((p.packaging || []).join(", "))}</td>
        <td>${esc(p.moq || "")}</td>
        <td>${esc(p.hsCode || "")}</td>
      </tr>`;
      document.getElementById("lc-body").innerHTML = cats.map((cat) => `
        <h2 class="cat">${esc(cat)}</h2>
        <table>
          <thead><tr><th>Product</th><th>Origin</th><th>Grades</th><th>Packaging</th><th>MOQ</th><th>HS Code</th></tr></thead>
          <tbody>${products.filter((p) => p.category === cat).map(row).join("")}</tbody>
        </table>`).join("");
    })();
  </script>
</body>
</html>
