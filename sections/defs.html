<!-- ===========================================================================
     sections/defs.html — the shared arch ornament
     ---------------------------------------------------------------------------
     The লতা পাতা (lota-pata) arch: a Bengal cusped arch wreathed in climbing
     vines, leaves, buds and small five-petal flowers, closing at a lotus-bud
     finial. Authored in assets/img/ornaments/arch-lota.svg — this is the same
     art, defined ONCE here and referenced by every arch on the page via <use>.

     WHY <use> AND NOT AN INLINE COPY PER ARCH:
     the ornament is ~14KB. There are 20+ product niches. Inlining it into each
     would put ~300KB of duplicated path data in the DOM. One definition + a
     <use> per arch costs almost nothing, and — because stroke-dasharray and
     stroke-dashoffset are INHERITED SVG properties — the draw-in animation set
     on the <use> element still cascades into the referenced art.

     WHY THREE SEPARATE GROUPS: CSS cannot reach inside a <use> shadow tree, so
     splitting frame / vines / crest is the only way to stagger them. The arch
     is drawn first, the vines grow up it, the finial clasps it last.

     NOTE: no vector-effect="non-scaling-stroke" anywhere. In Blink it is
     incompatible with pathLength + stroke-dasharray — the dash lengths resolve
     in screen space while pathLength normalises user space, which shatters every
     leaf into permanent fragments. Verified, not assumed. Stroke weight is
     handled with a small stroke-width instead.
     ======================================================================== */ -->
