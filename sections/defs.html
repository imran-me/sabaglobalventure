<!-- ===========================================================================
     sections/defs.html — the shared arch ornament
     ---------------------------------------------------------------------------
     The arch is wreathed not in generic leaves but in the motifs of Bengal:
     drooping RICE PANICLES (paddy), angular JAMDANI buti diamonds, and a SHAPLA
     (water-lily) bud at the finial — thin gold line art. Defined ONCE here and
     referenced by every arch on the page via <use> (hero portal, product niches).

     WHY <use> AND NOT AN INLINE COPY PER ARCH:
     one definition + a <use> per arch costs almost nothing, and — because
     stroke-dasharray and stroke-dashoffset are INHERITED SVG properties — the
     draw-in animation set on the <use> element still cascades into the art.

     WHY THREE SEPARATE GROUPS: CSS cannot reach inside a <use> shadow tree, so
     splitting frame / vines / crest is the only way to stagger them. The arch is
     drawn first, the paddy climbs it, the shapla bud clasps it last.

     Every drawable stroke carries class="lota-line" + pathLength="100" so the
     shared draw-in contract (stroke-dasharray/offset on the host <use>) animates
     it. NO vector-effect="non-scaling-stroke": in Blink it is incompatible with
     pathLength + stroke-dasharray. Verified, not assumed.
     ======================================================================== */ -->
<svg class="sgv-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- ===== The cusped arch frame (silhouette kept — client: not a temple) ===== -->
    <g id="sgv-arch-frame"><g data-part="frame">
      <path class="lota-line" pathLength="100" d="M0 140L0 76A32.07 32.07 0 0 1 7 56A13 13 0 0 1 16 36A13 13 0 0 1 30 20A10 10 0 0 1 43 10C46 8 49 5 50 2C51 5 54 8 57 10A10 10 0 0 1 70 20A13 13 0 0 1 84 36A13 13 0 0 1 93 56A32.07 32.07 0 0 1 100 76L100 140Z"/>
    </g></g>

    <!-- ===== The climbing paddy vine ===== =====================================
         A single stem climbs the RIGHT side of the arch; drooping rice panicles,
         jamdani diamonds and small buds branch off it. The LEFT side is the same
         art mirrored, so the two halves meet at the crest. -->
    <g id="sgv-arch-vines"><g data-part="vine-right" id="lota-vine">
      <!-- the stem: from the base up along the arch's shoulder to the apex -->
      <path class="lota-line" pathLength="100" d="M95 138 C96.5 118 95.8 98 94 82 C92.4 67 88.5 51 80.5 38 C74.5 28 66 19 57.5 13.5"/>

      <!-- rice panicle #1 (low) — an arching sprig with drooping grains -->
      <g transform="translate(94 112) rotate(14)">
        <path class="lota-line" pathLength="100" d="M0 0 C3 1 5.4 3 7 6.4"/>
        <path class="lota-line" pathLength="100" d="M1.6 .8 C2.9 1.4 3 3 2 4 C1.1 3 .9 1.7 1.6 .8 Z"/>
        <path class="lota-line" pathLength="100" d="M3.4 1.9 C4.7 2.5 4.8 4.1 3.8 5.1 C2.9 4.1 2.7 2.8 3.4 1.9 Z"/>
        <path class="lota-line" pathLength="100" d="M5.2 3.6 C6.5 4.2 6.6 5.8 5.6 6.8 C4.7 5.8 4.5 4.5 5.2 3.6 Z"/>
        <path class="lota-line" pathLength="100" d="M6.7 6 C7.9 6.7 7.9 8.2 6.9 9.1 C6.1 8.1 6 6.9 6.7 6 Z"/>
      </g>

      <!-- jamdani buti diamond beside the stem -->
      <g transform="translate(89 93)">
        <path class="lota-line" pathLength="100" d="M0 -3 L1.5 0 L0 3 L-1.5 0 Z"/>
        <circle class="lota-dot" cx="0" cy="0" r="0.5" fill="currentColor" stroke="none"/>
      </g>

      <!-- rice panicle #2 (mid) -->
      <g transform="translate(90 74) rotate(30)">
        <path class="lota-line" pathLength="100" d="M0 0 C3.2 1.1 5.6 3.2 7.2 6.8"/>
        <path class="lota-line" pathLength="100" d="M1.7 .9 C3 1.5 3.1 3.2 2.1 4.2 C1.2 3.2 1 1.8 1.7 .9 Z"/>
        <path class="lota-line" pathLength="100" d="M3.6 2 C4.9 2.7 5 4.3 4 5.3 C3.1 4.3 2.9 3 3.6 2 Z"/>
        <path class="lota-line" pathLength="100" d="M5.4 3.8 C6.8 4.5 6.9 6.1 5.9 7.1 C5 6.1 4.7 4.7 5.4 3.8 Z"/>
        <path class="lota-line" pathLength="100" d="M7 6.3 C8.3 7 8.3 8.6 7.3 9.5 C6.4 8.5 6.3 7.2 7 6.3 Z"/>
      </g>

      <!-- shapla-bud sprig on the stem -->
      <g transform="translate(85 56) rotate(46)">
        <path class="lota-line" pathLength="100" d="M0 0 C-1.6 -3 -1.6 -6.6 0 -9.4 C1.6 -6.6 1.6 -3 0 0 Z"/>
        <path class="lota-line" pathLength="100" d="M0 0 C-3 -2.2 -4.2 -5 -4.4 -8 C-2 -6.4 -.6 -3.4 0 0 Z"/>
        <path class="lota-line" pathLength="100" d="M0 0 C3 -2.2 4.2 -5 4.4 -8 C2 -6.4 .6 -3.4 0 0 Z"/>
      </g>

      <!-- jamdani buti diamond (upper) -->
      <g transform="translate(75 42)">
        <path class="lota-line" pathLength="100" d="M0 -2.6 L1.3 0 L0 2.6 L-1.3 0 Z"/>
        <circle class="lota-dot" cx="0" cy="0" r="0.45" fill="currentColor" stroke="none"/>
      </g>

      <!-- rice panicle #3 (high, toward apex) -->
      <g transform="translate(71 34) rotate(58)">
        <path class="lota-line" pathLength="100" d="M0 0 C2.6 .9 4.6 2.7 6 5.7"/>
        <path class="lota-line" pathLength="100" d="M1.4 .7 C2.5 1.2 2.6 2.6 1.7 3.5 C1 2.6 .8 1.5 1.4 .7 Z"/>
        <path class="lota-line" pathLength="100" d="M3 1.7 C4.1 2.2 4.2 3.6 3.3 4.5 C2.6 3.6 2.4 2.5 3 1.7 Z"/>
        <path class="lota-line" pathLength="100" d="M4.5 3.2 C5.6 3.8 5.7 5.2 4.8 6 C4.1 5.1 3.9 4 4.5 3.2 Z"/>
      </g>
    </g>
    <g data-part="vine-left">
      <use href="#lota-vine" transform="translate(100 0) scale(-1 1)" class="lota-line" pathLength="100"/>
    </g></g>

    <!-- ===== The shapla (water-lily) finial — clasps the arch at the apex ===== -->
    <g id="sgv-arch-crest"><g data-part="crest">
      <path class="lota-line" pathLength="100" d="M50 18 C47.4 12 47.4 5.2 50 1 C52.6 5.2 52.6 12 50 18 Z"/>
      <path class="lota-line" pathLength="100" d="M50 18 C45 14 42 8 42.4 2.8 C46 5 49 11 50 18 Z"/>
      <path class="lota-line" pathLength="100" d="M50 18 C55 14 58 8 57.6 2.8 C54 5 51 11 50 18 Z"/>
      <path class="lota-line" pathLength="100" d="M40.5 15.6 C39 11.5 39.2 7.6 41.6 5 C43 8 43 12 40.5 15.6 Z"/>
      <path class="lota-line" pathLength="100" d="M59.5 15.6 C61 11.5 60.8 7.6 58.4 5 C57 8 57 12 59.5 15.6 Z"/>
      <path class="lota-line" pathLength="100" d="M44 18.4 C48 16.4 52 16.4 56 18.4"/>
    </g></g>

    <!-- ===== corner flourish (featured ivory band) — paddy sprig + shapla bud ===
         One vine hugging a corner; CSS mirrors it into all four and tints it
         (gold on dark, indigo on ivory). Draws in via the shared .lo-line
         contract. Rice panicles and a shapla bud, not leaves. -->
    <g id="sgv-lota-corner">
      <!-- main stem: down the left edge, around the corner, along the top edge -->
      <path class="lo-line" pathLength="100" d="M3,52 C2,36 3,18 11,9 C21,1 36,1 50,5"/>
      <!-- secondary stem curling into the card -->
      <path class="lo-line" pathLength="100" d="M12,15 C17,19 21,25 22,33 C22.8,38 21.5,42 18,45"/>

      <!-- rice panicle on the left-edge run -->
      <g transform="translate(3,40) rotate(-24)">
        <path class="lo-line" pathLength="100" d="M0 0 C-3 1 -5.4 3 -7 6.4"/>
        <path class="lo-line" pathLength="100" d="M-1.6 .8 C-2.9 1.4 -3 3 -2 4 C-1.1 3 -.9 1.7 -1.6 .8 Z"/>
        <path class="lo-line" pathLength="100" d="M-3.4 1.9 C-4.7 2.5 -4.8 4.1 -3.8 5.1 C-2.9 4.1 -2.7 2.8 -3.4 1.9 Z"/>
        <path class="lo-line" pathLength="100" d="M-5.2 3.6 C-6.5 4.2 -6.6 5.8 -5.6 6.8 C-4.7 5.8 -4.5 4.5 -5.2 3.6 Z"/>
      </g>

      <!-- shapla bud near the corner apex -->
      <g transform="translate(11,8) rotate(-40)">
        <path class="lo-line" pathLength="100" d="M0 0 C-1.5 -2.8 -1.5 -6 0 -8.6 C1.5 -6 1.5 -2.8 0 0 Z"/>
        <path class="lo-line" pathLength="100" d="M0 0 C-2.7 -2 -3.8 -4.6 -4 -7.4 C-1.8 -5.8 -.5 -3 0 0 Z"/>
        <path class="lo-line" pathLength="100" d="M0 0 C2.7 -2 3.8 -4.6 4 -7.4 C1.8 -5.8 .5 -3 0 0 Z"/>
      </g>

      <!-- rice panicle on the top-edge run -->
      <g transform="translate(34,3) rotate(20)">
        <path class="lo-line" pathLength="100" d="M0 0 C3 -1 5.4 -3 7 -6.4"/>
        <path class="lo-line" pathLength="100" d="M1.6 -.8 C2.9 -1.4 3 -3 2 -4 C1.1 -3 .9 -1.7 1.6 -.8 Z"/>
        <path class="lo-line" pathLength="100" d="M3.4 -1.9 C4.7 -2.5 4.8 -4.1 3.8 -5.1 C2.9 -4.1 2.7 -2.8 3.4 -1.9 Z"/>
        <path class="lo-line" pathLength="100" d="M5.2 -3.6 C6.5 -4.2 6.6 -5.8 5.6 -6.8 C4.7 -5.8 4.5 -4.5 5.2 -3.6 Z"/>
      </g>

      <!-- jamdani buti diamonds punctuating the run -->
      <g transform="translate(22,33)">
        <path class="lo-line" pathLength="100" d="M0 -3 L1.6 0 L0 3 L-1.6 0 Z"/>
        <circle class="lota-dot" cx="0" cy="0" r="0.6" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(50,5)">
        <path class="lo-line" pathLength="100" d="M0 -3 L1.6 0 L0 3 L-1.6 0 Z"/>
        <circle class="lota-dot" cx="0" cy="0" r="0.6" fill="currentColor" stroke="none"/>
      </g>

      <!-- tendril curls at the stem ends -->
      <path class="lo-line" pathLength="100" d="M50,5 C55,4 58,7 57,11 C56,14 52,14 51,11 C50,9 52,7 54,8"/>
      <path class="lo-line" pathLength="100" d="M18,45 C16,49 18,53 22,54 C25,55 27,52 25,50 C24,49 22,50 22,52"/>
      <path class="lo-line" pathLength="100" d="M3,52 C0,55 -1,59 1,63 C2,65 5,65 5,62"/>
    </g>
  </defs>
</svg>
