<!-- ===========================================================================
     sections/featured.html — Featured products deck (auto-rotating)
     ---------------------------------------------------------------------------
     Sits FIRST, right after the hero — a bright ivory glimpse of the signature
     lines. Cards are injected by assets/js/featured.js from the live catalogue
     (products flagged featured:true in Admin → Products). 5 across on desktop,
     3 across on mobile; the deck quietly rotates through all featured items with
     a gold crossfade, pausing on hover / off-screen / hidden tab. The dark jewel
     cards sit on the ivory band like framed pieces on a gallery wall.
     ======================================================================== -->
<section class="featured section section--tight section--ivory" id="featured" data-bg-section="products">
  <!-- Blue লতা পাতা framing the ivory deck — the gold vine reads on indigo, so on
       this ivory chapter the same vine goes INDIGO instead. Section-level (not
       per-card) since the featured cards are photo-dominant. -->
  <span class="lota-frame lota-frame--section" aria-hidden="true" data-reveal>
    <svg class="lc lc-tl" viewBox="0 0 100 100"><use href="#sgv-lota-corner"></use></svg>
    <svg class="lc lc-tr" viewBox="0 0 100 100"><use href="#sgv-lota-corner"></use></svg>
    <svg class="lc lc-bl" viewBox="0 0 100 100"><use href="#sgv-lota-corner"></use></svg>
    <svg class="lc lc-br" viewBox="0 0 100 100"><use href="#sgv-lota-corner"></use></svg>
  </span>
  <div class="container">
    <div class="section-head section-head--center" data-reveal>
      <p class="eyebrow">Featured Selection</p>
      <h2>Signature Lines, <em>Hand-Picked</em></h2>
      <span class="title-rule"></span>
    </div>

    <!-- Rotating featured deck (injected) -->
    <div class="featured-row" data-featured aria-label="Featured products"></div>

    <div class="row row--center" style="margin-top:var(--space-6)">
      <a class="btn btn--royal" href="#products">View All Products &rarr;</a>
    </div>
  </div>
</section>
