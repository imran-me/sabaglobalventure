<!-- ===========================================================================
     sections/frieze.html — THE JOURNEY
     ---------------------------------------------------------------------------
     The centrepiece ornament, and the one that carries the most meaning.

     A single unbroken gold line — a terracotta-temple frieze, or an engraved
     banknote vignette — following the goods from the paddy field, down the
     braided delta, onto a nouka under sail, through the bazar, onto a Dhaka
     rickshaw with its painted back panel, across the quay and out on a ship.

     It sits exactly here on purpose: after "how the house works" and before the
     world map. It IS the bridge — the last thing you see before we show you
     where it all goes.

     It DRAWS ITSELF, scene by scene, left to right, at the pace you read.
     Source of truth: assets/img/ornaments/journey-frieze.svg — inlined here so
     currentColor and the stroke-dash animation work. Keep them in sync.
     ======================================================================== -->
