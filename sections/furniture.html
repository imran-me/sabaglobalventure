<!-- ===========================================================================
     sections/furniture.html — Site-wide UI furniture (shared on every page)
     ---------------------------------------------------------------------------
     Preloader, scroll-progress bar, floating contact dock, back-to-top pill and
     the toast container. Behaviour wired by nav.js / preloader.js / contact.js.
     Links read from config.js via main.js populateConfig().
     ======================================================================== -->

<!-- =========================================================================
     Preloader — the overture.
     The first two seconds decide whether a buyer believes the rest of the page.
     So: a gold ring DRAWS itself closed around the crest, the crest blooms
     inside it, the wordmark opens out of tight tracking, and a hairline rule
     runs out beneath. Then the whole thing lifts away. No spinner — a spinner
     says "please wait"; this says "you have arrived somewhere".
     ====================================================================== -->
<div class="preloader" role="status" aria-label="Loading">
  <div class="pre-inner">
    <div class="pre-mark">
      <!-- The ring is stroked so it can draw itself closed (stroke-dashoffset). -->
      <svg class="pre-ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/>
        <circle class="pre-ring-draw" cx="60" cy="60" r="56" fill="none"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                pathLength="100" transform="rotate(-90 60 60)"/>
      </svg>
      <img class="emblem" src="assets/img/icons/emblem.svg" alt="Saba Global Ventures crest">
    </div>
    <p class="pre-word" aria-hidden="true">SABA GLOBAL VENTURES</p>
    <span class="pre-rule" aria-hidden="true"></span>
    <p class="pre-tag" aria-hidden="true">Global Sourcing, Trusted Trading</p>
  </div>
</div>

<!-- Floating contact dock -->
<div class="dock" aria-label="Quick contact">
  <a class="dock-wa" data-config-href="whatsapp" data-tip="WhatsApp" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3 0-1.5.7-2.2 1-2.5.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.3c-.2.2-.3.4-.2.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.2.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.4.1.2.1.9-.1 1.5Z"/></svg>
  </a>
  <a class="dock-mail" data-config-href="email" data-tip="Email" aria-label="Email our trade desk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
  </a>
  <!-- Click-to-call for buyers who prefer the phone during Gulf daytime.
       Hidden automatically while config.phone is an unfilled placeholder. -->
  <a class="dock-tel" data-config-href="phone" data-tip="Call" aria-label="Call our trade desk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9Z"/></svg>
  </a>
  <!-- Jump to the catalogue (esp. handy on mobile). Icon only, no label. -->
  <a class="dock-products" href="#products" data-tip="Products" aria-label="View products">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m21 16-9 5-9-5V8l9-5 9 5z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
  </a>
</div>

<!-- The waterline (ART-VISION #18): a hairline gold river in the left margin
     that flows downward as you read — the page's one progress indicator (the
     conventional top bar is retired in CSS). The dot is the boat on the water. -->
<div class="waterline" aria-hidden="true">
  <span class="waterline-fill"></span>
  <span class="waterline-dot"></span>
</div>

<!-- Back to top -->
<button class="to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 15 6-6 6 6"/></svg>
  Top
</button>

<!-- Toast container -->
<div class="toast-wrap" aria-live="polite"></div>
