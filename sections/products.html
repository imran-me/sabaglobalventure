<!-- ===========================================================================
     sections/products.html — Products showcase (the centerpiece)
     ---------------------------------------------------------------------------
     Rebuilt to the client's reference: an "Our Products" banner (paddy-sunrise
     scene melting into Midnight Navy, with a "Rooted in Bengal" seal and a torn
     gold deckle edge), the circled gold category glyphs, horizontal photo cards,
     and a closing pull-quote flanked by a gold sampan and shapla.
     .filter-bar + .product-grid are injected by products.js from the Store.
     ======================================================================== -->
<section class="section section--products" id="products" data-bg-section="products">

  <!-- ===== The banner: "Our Products" over the Bengal delta at first light ===== -->
  <div class="products-banner" data-reveal>
    <!-- the paddy-sunrise photograph, full-bleed on the right, dissolving left into navy -->
    <div class="pb-scene" role="img" aria-label="Sunrise over a Bengal paddy field, a farmer at harvest and a sampan under sail on the river"></div>
    <span class="pb-paddy" aria-hidden="true"></span>

    <div class="container pb-inner">
      <div class="pb-copy">
        <p class="pb-kicker">From Bengal, to the World</p>
        <h2 class="pb-title"><span class="pb-our">Our</span><span class="pb-products">Products</span></h2>
        <span class="pb-rule" aria-hidden="true">
          <i></i>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 4l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
          <i></i>
        </span>
        <p class="pb-sub">Premium quality products from the fertile lands of Bengal, crafted for the world.</p>
      </div>

      <!-- the seal that rides the boundary of scene and copy -->
      <div class="pb-seal" data-reveal>
        <svg class="pb-lotus" viewBox="0 0 48 30" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M24 26 C21 18 21 9 24 3 C27 9 27 18 24 26 Z"/>
          <path d="M24 26 C18 21 13 14 13 6 C19 9 23 16 24 26 Z"/>
          <path d="M24 26 C30 21 35 14 35 6 C29 9 25 16 24 26 Z"/>
          <path d="M24 26 C15 24 8 20 4 13 C12 13 20 18 24 26 Z" stroke-opacity=".6"/>
          <path d="M24 26 C33 24 40 20 44 13 C36 13 28 18 24 26 Z" stroke-opacity=".6"/>
        </svg>
        <span>Rooted in Bengal<br><em>Delivering Worldwide</em></span>
      </div>
    </div>

    <!-- the hand-torn gold deckle edge where the scene gives way to the catalogue -->
    <span class="pb-torn" aria-hidden="true"></span>
  </div>

  <div class="container">
    <span class="side-rail" aria-hidden="true">The line card</span>

    <!-- Category filter — circled gold line-art glyphs (injected by products.js) -->
    <div class="filter-bar" role="group" aria-label="Filter products by category"></div>

    <!-- Product cards (injected by products.js) -->
    <div class="product-grid" data-reveal-stagger></div>

    <div class="row row--center" style="margin-top:2.5rem">
      <a class="btn btn--gold" data-cta="whatsapp">Request the Full Line Card &rarr;</a>
    </div>

    <!-- Closing pull-quote, flanked by a gold sampan (left) and a shapla (right) -->
    <p class="story-quote" data-reveal>
      <svg class="story-orn story-orn--l" viewBox="0 0 120 70" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 52h108"/>
        <path d="M20 52c8-3 76-26 84-29"/>
        <path d="M104 23l6 29"/>
        <path d="M104 23c-16 2-52 10-72 20"/>
        <path d="M40 52c-2-8-2-14 0-20"/>
        <path d="M10 56c12 4 88 4 100 0"/>
      </svg>
      <span class="q-rule" aria-hidden="true"></span>
      &ldquo;From the golden fields of Bengal to tables around the world.&rdquo;
      <span class="q-rule" aria-hidden="true"></span>
      <svg class="story-orn story-orn--r" viewBox="0 0 120 70" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g transform="translate(60 40)">
          <path d="M0 22 C-5 2 -5 -22 0 -42 C5 -22 5 2 0 22 Z"/>
          <path d="M0 22 C-18 10 -34 -6 -40 -28 C-16 -22 2 -6 0 22 Z"/>
          <path d="M0 22 C18 10 34 -6 40 -28 C16 -22 -2 -6 0 22 Z"/>
          <path d="M0 22 C-30 16 -50 6 -60 -12 C-30 -10 -10 4 0 22 Z" stroke-opacity=".55"/>
          <path d="M0 22 C30 16 50 6 60 -12 C30 -10 10 4 0 22 Z" stroke-opacity=".55"/>
        </g>
      </svg>
    </p>
  </div>
</section>
