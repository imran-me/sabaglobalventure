<!-- ===========================================================================
     sections/trust.html — The numbers, as an editorial band
     ---------------------------------------------------------------------------
     NOT a row of four boxed stat tiles. A single hairline-ruled band of
     oversized thin numerals, the way a report sets its headline figures —
     divided by vertical gold hairlines, with the certifications set as fine
     lettering on the right rather than as another row of chips.

     Injected by main.js renderStats() into [data-stats] and counted up by
     counters.js. "Trading Markets" is LIVE — it counts the active countries in
     Admin → Countries. Certifications come from config.js `certs`.

     Class contract with trust.css: .stats / .certs — do not rename.
     ======================================================================== -->
<section class="trust section section--tight" id="trust" data-bg-section="trust">
  <div class="container">
    <div class="trust-band">
      <div class="stats" data-stats></div>
      <div class="certs-wrap">
        <span class="certs-label">Certified</span>
        <div class="certs" data-certs></div>
      </div>
    </div>
  </div>
</section>
